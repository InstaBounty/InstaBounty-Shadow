---
- name: Configure InstaBounty Shadow development workstation
  hosts: shadow
  gather_facts: false

  vars:
    perform_final_reboot: true

  roles:
    - powershell
    - windows_terminal
    - sevenzip
    - role: connectivity
      tags:
        - connectivity
    - git
    - github_cli
    - vscode
    - role: postman
      tags:
        - postman
    - node
    - node_tools
    - role: playwright
      tags:
        - playwright
    - python
    - uv
    - build_tools
    - foundry
    - solidity_tools
    - java
    - role: elasticmq
      tags:
        - elasticmq
    - android
    - postgresql
    - nvidia
    - ollama
    - role: llm_models
      tags:
        - llm_models
        - ai_developer
    - role: ai_developer
      tags:
        - ai_developer
    - aws_cli
    - terraform
    - vscode_extensions

  post_tasks:
    - name: Reboot workstation after provisioning
      ansible.windows.win_reboot:
        msg: Rebooting after InstaBounty workstation provisioning
        reboot_timeout: 600
        connect_timeout: 5
        post_reboot_delay: 5
        test_command: 'Write-Output "ready"'
      when: perform_final_reboot | bool
