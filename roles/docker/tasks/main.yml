---
- name: Check virtualization support
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1

      $Ansible.Result = @{
        virtualization_firmware_enabled = [bool]$cpu.VirtualizationFirmwareEnabled
        slat_supported = [bool]$cpu.SecondLevelAddressTranslationExtensions
      }
  register: docker_virtualization

- name: Display virtualization capabilities
  ansible.builtin.debug:
    msg:
      - "Virtualization exposed to Windows: {{ docker_virtualization.result.virtualization_firmware_enabled }}"
      - "SLAT supported: {{ docker_virtualization.result.slat_supported }}"

- name: Check WSL2 availability
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $output = wsl.exe --status 2>&1
      $exitCode = $LASTEXITCODE

      $Ansible.Result = @{
        available = ($exitCode -eq 0)
        exit_code = $exitCode
        output    = ($output -join "`n")
      }
  register: docker_wsl_status

- name: Display WSL status
  ansible.builtin.debug:
    msg:
      - "WSL available: {{ docker_wsl_status.result.available }}"
      - "{{ docker_wsl_status.result.output }}"

- name: Validate WSL availability
  ansible.builtin.assert:
    that:
      - docker_wsl_status.result.available
    fail_msg: >-
      WSL is not functioning correctly on the Shadow machine.
      Docker Desktop requires a working WSL2 environment.

- name: Ensure WSL is set to version 2 by default
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $output = wsl.exe --set-default-version 2 2>&1

      if ($LASTEXITCODE -ne 0) {
        throw "Unable to set WSL default version to 2: $($output -join "`n")"
      }

      $Ansible.Result = ($output -join "`n")

- name: Update WSL
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $output = wsl.exe --update 2>&1

      if ($LASTEXITCODE -ne 0) {
        throw "WSL update failed: $($output -join "`n")"
      }

      $Ansible.Result = ($output -join "`n")
  register: docker_wsl_update

- name: Display WSL update result
  ansible.builtin.debug:
    msg: "{{ docker_wsl_update.result }}"

- name: Get WSL version
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $output = wsl.exe --version 2>&1

      if ($LASTEXITCODE -ne 0) {
        throw "Unable to determine WSL version: $($output -join "`n")"
      }

      $Ansible.Result = ($output -join "`n")
  register: docker_wsl_version

- name: Display WSL version
  ansible.builtin.debug:
    msg: "{{ docker_wsl_version.result }}"

- name: Check whether Docker Desktop is installed
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $dockerDesktop = 'C:\Program Files\Docker\Docker\Docker Desktop.exe'
      $dockerCli = 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'

      $installed =
        (Test-Path -LiteralPath $dockerDesktop) -and
        (Test-Path -LiteralPath $dockerCli)

      if ($installed) {
        $versionOutput = & $dockerCli --version

        if ($LASTEXITCODE -ne 0) {
          throw "Docker CLI version check failed with exit code $LASTEXITCODE"
        }

        $version = $versionOutput
      }
      else {
        $version = 'Not installed'
      }

      $Ansible.Result = @{
        installed = $installed
        version   = $version
      }
  register: docker_status

- name: Display Docker Desktop status
  ansible.builtin.debug:
    msg:
      - "Docker Desktop installed: {{ docker_status.result.installed }}"
      - "Docker version: {{ docker_status.result.version }}"

- name: Create temporary Docker installer directory
  ansible.windows.win_file:
    path: C:\Temp\InstaBounty\Docker
    state: directory
  when: not docker_status.result.installed

- name: Download Docker Desktop installer
  ansible.windows.win_get_url:
    url: https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe
    dest: C:\Temp\InstaBounty\Docker\DockerDesktopInstaller.exe
  when: not docker_status.result.installed

- name: Install Docker Desktop using WSL2 backend
  ansible.windows.win_command:
    cmd: >-
      "C:\Temp\InstaBounty\Docker\DockerDesktopInstaller.exe"
      install
      --quiet
      --accept-license
      --backend=wsl-2
      --no-windows-containers
  register: docker_install
  changed_when: docker_install.rc == 0
  failed_when: docker_install.rc != 0
  when: not docker_status.result.installed

- name: Add Docker CLI to machine PATH
  ansible.windows.win_path:
    elements:
      - 'C:\Program Files\Docker\Docker\resources\bin'
    scope: machine
    state: present
  register: docker_path

- name: Verify Docker Desktop files
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $desktop = 'C:\Program Files\Docker\Docker\Docker Desktop.exe'
      $cli = 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'

      if (-not (Test-Path -LiteralPath $desktop)) {
        throw "Docker Desktop executable was not found at $desktop"
      }

      if (-not (Test-Path -LiteralPath $cli)) {
        throw "Docker CLI executable was not found at $cli"
      }

      $version = & $cli --version

      if ($LASTEXITCODE -ne 0) {
        throw "Docker CLI version check failed"
      }

      $Ansible.Result = $version
  register: docker_version

- name: Display installed Docker version
  ansible.builtin.debug:
    msg: "{{ docker_version.result }}"

- name: Remove Docker installer
  ansible.windows.win_file:
    path: C:\Temp\InstaBounty\Docker
    state: absent
  when: docker_install.changed | default(false)
