---
# Native browsers for interactive, account-isolated InstaBounty testing.
# Safari cannot be provisioned on Windows; see the WebKit role and README.
- name: Install Google Chrome and Mozilla Firefox for manual testing
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
      if (-not $winget) {
        $candidate = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\winget.exe'
        if (Test-Path -LiteralPath $candidate) { $winget = $candidate }
      }
      $browsers = @(
        @{
          name = 'Google Chrome'
          id = 'Google.Chrome'
          paths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
          )
        },
        @{
          name = 'Mozilla Firefox'
          id = 'Mozilla.Firefox'
          paths = @(
            "${env:ProgramFiles}\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          )
        }
      )
      $results = @()
      foreach ($browser in $browsers) {
        $found = @($browser.paths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
        if ($found.Count -eq 0) {
          if (-not $winget) {
            throw "Cannot install $($browser.name): winget.exe is unavailable for the Shadow Ansible user. Install Microsoft App Installer/winget and rerun --tags browsers."
          }
          & $winget install --id $browser.id --exact --source winget --scope machine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install $($browser.name) using winget (exit code $LASTEXITCODE)."
          }
          $Ansible.Changed = $true
          $found = @($browser.paths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          if ($found.Count -eq 0) {
            throw "$($browser.name) installer exited successfully but its executable was not found. Check the machine installation."
          }
        }
        $results += @{
          name = $browser.name
          path = $found[0]
          version = (Get-Item -LiteralPath $found[0]).VersionInfo.ProductVersion
        }
      }
      $Ansible.Result = $results
  register: browser_installation

- name: Display installed interactive browsers
  ansible.builtin.debug:
    var: browser_installation.result

# Playwright's WebKit is a test engine, NOT Apple Safari. It is useful for
# cross-engine PWA checks; real iOS Safari requires Apple hardware/cloud Macs.
- name: Install Playwright WebKit engine for iPhone-like PWA testing
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $node = 'C:\Program Files\nodejs\node.exe'
      $npm = 'C:\Program Files\nodejs\npm.cmd'
      if (-not (Test-Path -LiteralPath $node) -or -not (Test-Path -LiteralPath $npm)) {
        throw 'Node.js and npm must be installed before the WebKit test engine.'
      }
      $root = 'C:\InstaBounty\browser-testing'
      $cache = Join-Path $env:LOCALAPPDATA 'ms-playwright'
      $env:PLAYWRIGHT_BROWSERS_PATH = $cache
      if (-not (Test-Path -LiteralPath $root)) {
        New-Item -ItemType Directory -Path $root -Force | Out-Null
      }
      if (-not (Test-Path -LiteralPath (Join-Path $root 'node_modules\playwright\cli.js'))) {
        # Keep a dedicated tooling install, separate from each application's
        # version-pinned Playwright dependencies and browser revisions.
        & $npm install --prefix $root --no-audit --no-fund --no-save playwright@latest
        if ($LASTEXITCODE -ne 0) {
          throw "Unable to provision standalone Playwright tooling (exit $LASTEXITCODE)."
        }
        $Ansible.Changed = $true
      }
      $cacheBefore = @(Get-ChildItem -LiteralPath $cache -Directory -Filter 'webkit-*' -ErrorAction SilentlyContinue)
      & $node (Join-Path $root 'node_modules\playwright\cli.js') install webkit
      if ($LASTEXITCODE -ne 0) {
        throw "Playwright WebKit installation failed (exit $LASTEXITCODE)."
      }
      $cacheAfter = @(Get-ChildItem -LiteralPath $cache -Directory -Filter 'webkit-*' -ErrorAction SilentlyContinue)
      if ($cacheAfter.Count -eq 0) { throw 'Playwright did not populate its WebKit browser cache.' }
      if ($cacheBefore.Count -eq 0 -or $cacheAfter.Count -ne $cacheBefore.Count) {
        $Ansible.Changed = $true
      }
      $Ansible.Result = @{
        engine = 'Playwright WebKit (not Apple Safari)'
        cache = $cache
        cli = (Join-Path $root 'node_modules\playwright\cli.js')
      }
  register: browsers_webkit

- name: Report WebKit PWA test engine
  ansible.builtin.debug:
    var: browsers_webkit.result

- name: Create shared InstaBounty browser test helper directory
  ansible.windows.win_file:
    path: 'C:\InstaBounty\tools'
    state: directory

- name: Deploy isolated test browser profile launcher
  ansible.windows.win_copy:
    src: open-test-browser.ps1
    dest: 'C:\InstaBounty\tools\open-test-browser.ps1'

- name: Deploy persistent WebKit user profile runner
  ansible.windows.win_copy:
    src: open-test-webkit.cjs
    dest: 'C:\InstaBounty\tools\open-test-webkit.cjs'
