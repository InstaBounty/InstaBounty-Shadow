---
- name: Resolve current Windows user profile
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $Ansible.Result = $env:USERPROFILE
  register: ai_developer_user_profile

- name: Verify Ollama API is available for AI developer
  ansible.windows.win_uri:
    url: "{{ ai_developer_ollama_url }}/api/version"
    method: GET
    status_code: 200
  register: ai_developer_ollama_status
  retries: 10
  delay: 2
  until: ai_developer_ollama_status.status_code == 200

- name: Read installed Ollama models for AI developer
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $response = Invoke-RestMethod -Uri '{{ ai_developer_ollama_url }}/api/tags' -Method Get -TimeoutSec 10
      $models = @()
      if ($response.models) {
        $models = @($response.models | ForEach-Object { $_.name })
      }
      $Ansible.Result = $models
  register: ai_developer_models

- name: Validate AI developer models are installed
  ansible.builtin.assert:
    that:
      - ai_developer_model in ai_developer_models.result
      - ai_reviewer_model in ai_developer_models.result
    fail_msg: >-
      The AI developer requires {{ ai_developer_model }} and
      {{ ai_reviewer_model }}. Run the llm_models role first.

- name: Create AI developer install directory
  ansible.windows.win_file:
    path: "{{ ai_developer_install_dir }}"
    state: directory

- name: Create AI developer bin directory
  ansible.windows.win_file:
    path: "{{ ai_developer_bin_dir }}"
    state: directory

- name: Install or update Aider
  ansible.windows.win_command:
    cmd: >-
      uv tool install --force --python 3.12 --with pip
      "{{ ai_developer_aider_package }}"
  environment:
    UV_TOOL_BIN_DIR: "{{ ai_developer_bin_dir }}"
  register: ai_developer_aider_install
  changed_when: >-
    'Installed' in ai_developer_aider_install.stdout or
    'Updated' in ai_developer_aider_install.stdout or
    'Resolved' in ai_developer_aider_install.stdout

- name: Verify Aider is available
  ansible.windows.win_command:
    cmd: '"{{ ai_developer_bin_dir }}\\aider.exe" --version'
  changed_when: false

- name: Install Aider-backed AI developer runner
  ansible.windows.win_copy:
    src: ai_developer.py
    dest: "{{ ai_developer_install_dir }}\\ai_developer.py"

- name: Calculate source AI developer runner checksum
  ansible.builtin.stat:
    path: "{{ role_path }}/files/ai_developer.py"
    checksum_algorithm: sha256
  register: ai_developer_source_runner
  delegate_to: localhost
  become: false

- name: Calculate installed AI developer runner checksum
  ansible.windows.win_stat:
    path: "{{ ai_developer_install_dir }}\\ai_developer.py"
    get_checksum: true
    checksum_algorithm: sha256
  register: ai_developer_installed_runner

- name: Validate installed AI developer runner checksum
  ansible.builtin.assert:
    that:
      - ai_developer_source_runner.stat.checksum == ai_developer_installed_runner.stat.checksum
    fail_msg: >-
      Installed AI developer runner does not match the Ansible role source.
      Refusing to continue with a stale runtime.

- name: Install AI reviewer system prompt
  ansible.windows.win_copy:
    src: reviewer_prompt.md
    dest: "{{ ai_developer_install_dir }}\\reviewer_prompt.md"

- name: Install AI developer command
  ansible.windows.win_template:
    src: ai-dev.cmd.j2
    dest: "{{ ai_developer_bin_dir }}\\ai-dev.cmd"

- name: Install AI review command
  ansible.windows.win_template:
    src: ai-review.cmd.j2
    dest: "{{ ai_developer_bin_dir }}\\ai-review.cmd"

- name: Add AI developer commands to machine PATH
  ansible.windows.win_path:
    elements:
      - "{{ ai_developer_bin_dir }}"
    scope: machine
    state: present

- name: Verify AI developer runner syntax
  ansible.windows.win_command:
    cmd: >-
      py -3 -m py_compile
      "{{ ai_developer_install_dir }}\\ai_developer.py"
  changed_when: false

- name: Display AI developer installation
  ansible.builtin.debug:
    msg:
      - "Implementation agent: Aider + ollama_chat/{{ ai_developer_model }}"
      - "AI reviewer model: {{ ai_reviewer_model }}"
      - "AI developer runner version: {{ ai_developer_runner_version }}"
      - "Installed runner checksum verified against role source."
      - "Run ai-dev --help from a new terminal after provisioning."
