---
# ---------------------------------------------------------
# Configuration
# ---------------------------------------------------------

- name: Define Android configuration
  ansible.builtin.set_fact:
    android_studio_dir: 'C:\Program Files\Android\Android Studio'
    android_sdk_dir: 'C:\Android\Sdk'
    android_temp_dir: 'C:\Temp\InstaBounty\Android'

    android_studio_installer_url: >-
      https://redirector.gvt1.com/edgedl/android/studio/install/2026.2.1.8/android-studio-2026.2.1.8-windows.exe

    android_cmdline_tools_url: >-
      https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip

    android_platform: 'android-36'
    android_build_tools: '36.0.0'


# ---------------------------------------------------------
# Android Studio
# ---------------------------------------------------------

- name: Check whether Android Studio is installed
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $studio = 'C:\Program Files\Android\Android Studio\bin\studio64.exe'
      $installed = Test-Path -LiteralPath $studio

      $Ansible.Result = @{
        installed = $installed
        path      = $studio
      }
  register: android_studio_status

- name: Display Android Studio status
  ansible.builtin.debug:
    msg:
      - "Android Studio installed: {{ android_studio_status.result.installed }}"
      - "Path: {{ android_studio_status.result.path }}"

- name: Create Android temporary directory
  ansible.windows.win_file:
    path: "{{ android_temp_dir }}"
    state: directory

- name: Download Android Studio installer
  ansible.windows.win_get_url:
    url: "{{ android_studio_installer_url }}"
    dest: "{{ android_temp_dir }}\\AndroidStudioSetup.exe"
  when: not android_studio_status.result.installed

- name: Install Android Studio
  ansible.windows.win_package:
    path: "{{ android_temp_dir }}\\AndroidStudioSetup.exe"
    state: present
    arguments: /S
  register: android_studio_install
  when: not android_studio_status.result.installed

- name: Verify Android Studio installation
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $studio = 'C:\Program Files\Android\Android Studio\bin\studio64.exe'

      if (-not (Test-Path -LiteralPath $studio)) {
        throw "Android Studio was not found at $studio after installation"
      }

      $Ansible.Result = $studio
  register: android_studio_after

- name: Display Android Studio installation path
  ansible.builtin.debug:
    msg: "Android Studio installed at {{ android_studio_after.result }}"


# ---------------------------------------------------------
# Android SDK directory
# ---------------------------------------------------------

- name: Create Android SDK directory
  ansible.windows.win_file:
    path: "{{ android_sdk_dir }}"
    state: directory


# ---------------------------------------------------------
# Android command-line tools
# ---------------------------------------------------------

- name: Check whether Android command-line tools are installed
  ansible.windows.win_stat:
    path: "{{ android_sdk_dir }}\\cmdline-tools\\latest\\bin\\sdkmanager.bat"
  register: android_cmdline_tools_status

- name: Download Android command-line tools
  ansible.windows.win_get_url:
    url: "{{ android_cmdline_tools_url }}"
    dest: "{{ android_temp_dir }}\\commandlinetools.zip"
  when: not android_cmdline_tools_status.stat.exists

- name: Create command-line tools extraction directory
  ansible.windows.win_file:
    path: "{{ android_temp_dir }}\\cmdline-tools"
    state: directory
  when: not android_cmdline_tools_status.stat.exists

- name: Extract Android command-line tools
  community.windows.win_unzip:
    src: "{{ android_temp_dir }}\\commandlinetools.zip"
    dest: "{{ android_temp_dir }}\\cmdline-tools"
  when: not android_cmdline_tools_status.stat.exists

- name: Create Android command-line tools parent directory
  ansible.windows.win_file:
    path: "{{ android_sdk_dir }}\\cmdline-tools"
    state: directory

- name: Install Android command-line tools
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $source = '{{ android_temp_dir }}\cmdline-tools\cmdline-tools'
      $target = '{{ android_sdk_dir }}\cmdline-tools\latest'

      if (Test-Path -LiteralPath $target) {
        return
      }

      if (-not (Test-Path -LiteralPath $source)) {
        throw "Extracted Android command-line tools were not found at $source"
      }

      Move-Item -LiteralPath $source -Destination $target

      $Ansible.Changed = $true
  when: not android_cmdline_tools_status.stat.exists


# ---------------------------------------------------------
# Environment variables
# ---------------------------------------------------------

- name: Set ANDROID_HOME
  ansible.windows.win_environment:
    state: present
    name: ANDROID_HOME
    value: "{{ android_sdk_dir }}"
    level: machine

- name: Set ANDROID_SDK_ROOT
  ansible.windows.win_environment:
    state: present
    name: ANDROID_SDK_ROOT
    value: "{{ android_sdk_dir }}"
    level: machine


# ---------------------------------------------------------
# PATH configuration
# ---------------------------------------------------------

- name: Add Android tools to machine PATH
  ansible.windows.win_path:
    elements:
      - "{{ android_sdk_dir }}\\platform-tools"
      - "{{ android_sdk_dir }}\\cmdline-tools\\latest\\bin"
      - "{{ android_studio_dir }}\\bin"
    scope: machine
    state: present
  register: android_path


# ---------------------------------------------------------
# Accept Android SDK licences
# ---------------------------------------------------------

- name: Accept Android SDK licences
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $sdkmanager = '{{ android_sdk_dir }}\cmdline-tools\latest\bin\sdkmanager.bat'

      if (-not (Test-Path -LiteralPath $sdkmanager)) {
        throw "sdkmanager was not found at $sdkmanager"
      }

      1..100 |
        ForEach-Object { 'y' } |
        & $sdkmanager --licenses

      if ($LASTEXITCODE -ne 0) {
        throw "Android SDK licence acceptance failed with exit code $LASTEXITCODE"
      }


# ---------------------------------------------------------
# Install SDK packages
# ---------------------------------------------------------

- name: Install Android SDK packages
  ansible.windows.win_powershell:
    script: |
      $sdkmanager = '{{ android_sdk_dir }}\cmdline-tools\latest\bin\sdkmanager.bat'

      if (-not (Test-Path -LiteralPath $sdkmanager)) {
        throw "sdkmanager was not found at $sdkmanager"
      }

      $packages = @(
        'platform-tools',
        'platforms;{{ android_platform }}',
        'build-tools;{{ android_build_tools }}'
      )

      & $sdkmanager --install $packages

      if ($LASTEXITCODE -ne 0) {
        throw "Android SDK package installation failed with exit code $LASTEXITCODE"
      }


# ---------------------------------------------------------
# Verify SDK Manager
# ---------------------------------------------------------

- name: Verify Android SDK Manager
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $sdkmanager = '{{ android_sdk_dir }}\cmdline-tools\latest\bin\sdkmanager.bat'

      if (-not (Test-Path -LiteralPath $sdkmanager)) {
        throw "sdkmanager.bat was not found at $sdkmanager"
      }

      $version = & $sdkmanager --version

      if ($LASTEXITCODE -ne 0) {
        throw "sdkmanager verification failed"
      }

      $Ansible.Result = ($version | Select-Object -First 1)
  register: android_sdkmanager_version

- name: Display Android SDK Manager version
  ansible.builtin.debug:
    msg: "Android SDK Manager: {{ android_sdkmanager_version.result }}"


# ---------------------------------------------------------
# Verify ADB
# ---------------------------------------------------------

- name: Verify ADB installation
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      $adb = '{{ android_sdk_dir }}\platform-tools\adb.exe'

      if (-not (Test-Path -LiteralPath $adb)) {
        throw "adb.exe was not found at $adb"
      }

      $version = & $adb version

      if ($LASTEXITCODE -ne 0) {
        throw "adb verification failed"
      }

      $Ansible.Result = ($version | Select-Object -First 1)
  register: android_adb_version

- name: Display ADB version
  ansible.builtin.debug:
    msg: "{{ android_adb_version.result }}"


# ---------------------------------------------------------
# Verify Android platform
# ---------------------------------------------------------

- name: Verify Android platform installation
  ansible.windows.win_stat:
    path: "{{ android_sdk_dir }}\\platforms\\{{ android_platform }}"
  register: android_platform_status

- name: Validate Android platform installation
  ansible.builtin.assert:
    that:
      - android_platform_status.stat.exists
    fail_msg: >-
      Android platform {{ android_platform }} was not found after installation.


# ---------------------------------------------------------
# Verify Android Build Tools
# ---------------------------------------------------------

- name: Verify Android Build Tools installation
  ansible.windows.win_stat:
    path: "{{ android_sdk_dir }}\\build-tools\\{{ android_build_tools }}"
  register: android_build_tools_status

- name: Validate Android Build Tools installation
  ansible.builtin.assert:
    that:
      - android_build_tools_status.stat.exists
    fail_msg: >-
      Android Build Tools {{ android_build_tools }}
      were not found after installation.


# ---------------------------------------------------------
# Final status
# ---------------------------------------------------------

- name: Display Android development environment
  ansible.builtin.debug:
    msg:
      - "Android Studio: {{ android_studio_dir }}"
      - "Android SDK: {{ android_sdk_dir }}"
      - "Android platform: {{ android_platform }}"
      - "Android Build Tools: {{ android_build_tools }}"
      - "ANDROID_HOME: {{ android_sdk_dir }}"
      - "ADB: {{ android_sdk_dir }}\\platform-tools\\adb.exe"


# ---------------------------------------------------------
# Cleanup
# ---------------------------------------------------------

- name: Remove temporary Android files
  ansible.windows.win_file:
    path: "{{ android_temp_dir }}"
    state: absent
